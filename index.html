<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monster Group TierApp</title>
  <style>
    :root {
      --tier-5: #ff3b30; --tier-4: #ff9500; --tier-3: #ffcc00; --tier-2: #11a84e; --tier-1: #007aff;
      --bg-dark: #121212; --surface: #1c1c1e; --accent: #30d158;
    }

    body { font-family: -apple-system, sans-serif; background-color: var(--bg-dark); color: #fff; margin: 0; padding: 10px; }
    
    /* Tier Sorok: Itt a képek egymás alatt lesznek */
    .tier-board { display: flex; flex-direction: column; gap: 4px; background: #000; padding: 4px; border-radius: 8px; }
    .tier-row { display: flex; background: var(--surface); border-radius: 6px; overflow: hidden; min-height: 60px; }
    
    .tier-badge {
      width: 50px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #000; flex-shrink: 0;
    }
    
    /* A Zóna: Egymás alatt elrendezés */
    .tier-zone { 
      flex: 1; display: flex; flex-direction: column; /* EGYSÉG ALATTI ELRENDEZÉS */
      padding: 5px; gap: 5px; min-height: 55px; 
    }
    
    .tier-zone.drag-hover { background: rgba(255, 255, 255, 0.1); }

    .tier-img { 
      height: 50px; width: 50px; object-fit: contain; cursor: grab;
      user-select: none; border-radius: 4px;
      -webkit-touch-callout: none;
    }

    /* Alsó csúszka: Vízszintes marad */
    .unassigned-section { 
      position: sticky; bottom: 0; background: #1c1c1e; padding: 10px;
      border-top: 1px solid #333; z-index: 100;
    }
    .unassigned-zone { 
      display: flex; flex-direction: row; /* VÍZSZINTES marad */
      overflow-x: auto; gap: 10px; padding-bottom: 5px;
    }
    .unassigned-zone .tier-img { flex-shrink: 0; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.0/DragDropTouch.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- (A HTML szerkezet marad ugyanaz, a CSS/JS logikát cseréld ki az alábbira) -->
  
  <script>
    // ... (Firebase és adatok maradnak) ...

    // A húzási logika frissítése a függőleges irányhoz:
    function getDragAfterElement(container, y) {
      // Függőlegesen keressük az elemet (clientY helyett)
      const elements = [...container.querySelectorAll('.tier-img:not(.dragging)')];
      return elements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
        else return closest;
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // A drop eseményben is cseréld le a clientX-et clientY-ra:
    // ... (Az attachDragEvents függvényen belül) ...
    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('drag-hover');
      const afterElement = getDragAfterElement(zone, e.clientY); // Y koordináta
      if (afterElement == null) zone.appendChild(draggedImg);
      else zone.insertBefore(draggedImg, afterElement);
    });

    // ... (A többi rész marad az előző verzióból) ...
  </script>
</body>
</html>
