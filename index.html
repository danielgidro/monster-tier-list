<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monster Group TierApp</title>
  <style>
    :root {
      --tier-5: #ff3b30; 
      --tier-4: #ff9500; 
      --tier-3: #ffcc00; 
      --tier-2: #11a84e; 
      --tier-1: #007aff; 
      --bg-dark: #121212;
      --surface: #1c1c1e; 
      --accent: #30d158;
      --danger: #ff453a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark); color: #fff; margin: 0; padding: 15px;
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: 140px;
      user-select: none; -webkit-user-select: none;
    }

    h1 { margin-bottom: 2px; font-size: 22px; text-transform: uppercase; text-align: center; color: #fff; }
    p.subtitle { color: #8e8e93; margin-top: 0; margin-bottom: 15px; font-size: 13px; text-align: center; }

    .room-bar {
      background: var(--surface); padding: 12px; border-radius: 10px; width: 100%;
      max-width: 800px; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; justify-content: space-between; border: 1px solid #3a3a3c;
      box-sizing: border-box; color: #fff;
    }
    .room-bar label { color: #fff; font-size: 14px; }
    .room-bar input {
      background: #2c2c2e; color: #fff; border: 1px solid #444; padding: 8px;
      border-radius: 6px; font-size: 14px; width: 110px;
    }
    .room-bar button {
      background: var(--accent); color: #000; border: none; padding: 8px 14px;
      border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .room-bar button.leave-btn {
      background: var(--danger); color: #fff;
    }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn {
      background: #2c2c2e; color: #8e8e93; border: none; padding: 10px 14px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .tab-btn.active { background: var(--accent); color: #000; }

    .tab-content { display: none; width: 100%; max-width: 800px; }
    .tab-content.active { display: block; }

    .tier-board { display: flex; flex-direction: column; gap: 6px; background: #000; padding: 6px; border-radius: 10px; width: 100%; box-sizing: border-box; }
    .tier-row { display: flex; background: var(--surface); min-height: 75px; border-radius: 6px; overflow: hidden; }
    .tier-badge {
      width: 65px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #000; flex-shrink: 0;
    }
    .badge-5 { background: var(--tier-5); }
    .badge-4 { background: var(--tier-4); }
    .badge-3 { background: var(--tier-3); }
    .badge-2 { background: var(--tier-2); }
    .badge-1 { background: var(--tier-1); }

    .tier-zone { 
      flex: 1; display: flex; flex-direction: row; 
      align-items: center; gap: 6px; padding: 8px; min-height: 60px; 
      overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
      cursor: pointer;
    }
    .tier-zone::-webkit-scrollbar { height: 6px; }
    .tier-zone::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .unassigned-section { 
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(28, 28, 30, 0.98); 
      backdrop-filter: blur(10px);
      padding: 10px 15px; 
      border-top: 1px solid #3a3a3c; 
      box-shadow: 0 -4px 20px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }
    .unassigned-title { font-size: 11px; font-weight: bold; color: #8e8e93; margin-bottom: 6px; text-transform: uppercase; }

    .unassigned-zone {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      -webkit-overflow-scrolling: touch;
      gap: 10px;
      padding-bottom: 5px;
      width: 100%;
    }

    .unassigned-zone::-webkit-scrollbar { height: 6px; }
    .unassigned-zone::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .tier-img { 
      height: 65px; width: 65px; object-fit: contain; cursor: pointer; border-radius: 6px; flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s, border 0.15s;
      border: 2px solid transparent;
    }
    .tier-img.selected {
      border: 2px solid var(--accent);
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(48, 209, 88, 0.6);
    }

    .friend-picker { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .friend-select-box {
      background: #2c2c2e; color: #ffffff; padding: 12px 16px; border-radius: 8px;
      font-size: 16px; font-weight: bold; border: 1px solid #444; width: 100%;
      box-sizing: border-box; cursor: pointer; outline: none;
    }
    .friend-select-box option { background-color: #2c2c2e; color: #ffffff; }
    .no-friends-msg {
      background: var(--surface); padding: 35px 20px; border-radius: 10px;
      text-align: center; color: #8e8e93; font-size: 16px; font-weight: bold;
      border: 1px dashed #3a3a3c;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>Monster Group TierList</h1>
  <p class="subtitle">Real-time Group Rating</p>

  <div class="room-bar">
    <div>
      <label>Room: </label>
      <input type="text" id="room-input" value="">
    </div>
    <div>
      <label>Name: </label>
      <input type="text" id="name-input" value="">
    </div>
    <div style="display: flex; gap: 6px;">
      <button onclick="connectToRoom()">Join</button>
      <button class="leave-btn" onclick="leaveRoom()">Leave</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('group', this)">📊 Group Tier</button>
    <button class="tab-btn" onclick="switchTab('my', this)">✏️ My Tier</button>
    <button class="tab-btn" onclick="switchTab('friends', this)">👥 Friends</button>
  </div>

  <div id="tab-group" class="tab-content active">
    <div id="group-board" class="tier-board"></div>
  </div>

  <div id="tab-my" class="tab-content">
    <div id="my-board" class="tier-board"></div>
  </div>

  <div class="unassigned-section">
    <div class="unassigned-title">📦 Kattints egy képre, majd egy másikra (elé teszi) vagy üres sávra (végére teszi)</div>
    <div class="tier-zone unassigned-zone" data-tier="0" onclick="handleZoneClick(event, this)"></div>
  </div>

  <div id="tab-friends" class="tab-content">
    <div id="friend-container">
      <div class="friend-picker">
        <label style="font-size: 13px; font-weight: bold; color: #8e8e93; text-transform: uppercase;">Select Friend:</label>
        <select id="friend-select" class="friend-select-box" onchange="renderFriendView()"></select>
      </div>
      <div id="friend-board" class="tier-board"></div>
    </div>
    <div id="no-friends-msg" class="no-friends-msg" style="display: none;">
      👥 No friends added yet in this room.
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBm-OZUTOdc20Jx637WFLXCrQs_QnHViYA",
      authDomain: "monster-tier-list.firebaseapp.com",
      projectId: "monster-tier-list",
      storageBucket: "monster-tier-list.firebasestorage.app",
      messagingSenderId: "155876294578",
      appId: "1:155876294578:web:3641c1bc9513b4bf16eeab",
      measurementId: "G-3R00X2SMSM",
      databaseURL: "https://monster-tier-list-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const products = [
      { id: '1',  name: 'Aussie Lemonade',          img: 'Aussie Lemonade.png' },
      { id: '2',  name: 'Bad Apple',                img: 'Bad Apple.png' },
      { id: '3',  name: 'Energy Zero Sugar',        img: 'Energy Zero Sugar.png' },
      { id: '4',  name: 'Energy',                   img: 'Energy.png' },
      { id: '5',  name: 'Full Throttle',            img: 'Full Throttle.png' },
      { id: '6',  name: 'Khaotic',                  img: 'Khaotic.png' },
      { id: '7',  name: 'Lando Norris',             img: 'Lando Norris.png' },
      { id: '8',  name: 'Mango Loco',               img: 'Mango Loco.png' },
      { id: '9',  name: 'Monarch',                  img: 'Monarch.png' },
      { id: '10', name: 'Nitro Cosmic Peach',       img: 'Nitro Cosmic Peach.png' },
      { id: '11', name: 'Nitro Super Dry',          img: 'Nitro Super Dry.png' },
      { id: '12', name: 'Pacific Punch',            img: 'Pacific Punch.png' },
      { id: '13', name: 'Pipeline Punch',           img: 'Pipeline Punch.png' },
      { id: '14', name: 'Rehab Lemonade Tea',       img: 'Rehab Lemonade Tea.png' },
      { id: '15', name: 'Rehab Peach Tea',          img: 'Rehab Peach Tea.png' },
      { id: '16', name: 'Rio Punch',                img: 'Rio Punch.png' },
      { id: '17', name: 'Ultra Black',              img: 'Ultra Black.png' },
      { id: '18', name: 'Ultra Fantasy Ruby Red',   img: 'Ultra Fantasy Ruby Red.png' },
      { id: '19', name: 'Ultra Fiesta Mango',       img: 'Ultra Fiesta Mango.png' },
      { id: '20', name: 'Ultra Golden Pineapple',   img: 'Ultra Golden Pineapple.png' },
      { id: '21', name: 'Ultra Paradise',           img: 'Ultra Paradise.png' },
      { id: '22', name: 'Ultra Peachy Keen',        img: 'Ultra Peachy Keen.png' },
      { id: '23', name: 'Ultra Rosa',               img: 'Ultra Rosa.png' },
      { id: '24', name: 'Ultra Strawberry Dreams',  img: 'Ultra Strawberry Dreams.png' },
      { id: '25', name: 'Ultra Vice Guava',         img: 'Ultra Vice Guava.png' },
      { id: '26', name: 'Ultra Violet',             img: 'Ultra Violet.png' },
      { id: '27', name: 'Ultra Watermelon',         img: 'Ultra Watermelon.png' },
      { id: '28', name: 'Ultra Zero',               img: 'Ultra Zero.png' },
      { id: '29', name: 'Viking Berry',             img: 'Viking Berry.png' },
      { id: '30', name: 'VR46 Doctor',              img: 'VR46 Doctor.png' },
      { id: '31', name: 'VR46 Zero',                img: 'VR46 Zero.png' }
    ];

    let roomData = {};
    let currentConnectionRef = null; 
    let myData = [];
    let selectedProductId = null; 
    
    function resetMyDataToDefault() {
      myData = products.map(p => ({ id: p.id, t: 0, p: 0 }));
    }
    resetMyDataToDefault();

    const tierLevels = [
      { level: 5, label: '5★', class: 'badge-5' }, { level: 4, label: '4★', class: 'badge-4' },
      { level: 3, label: '3★', class: 'badge-3' }, { level: 2, label: '2★', class: 'badge-2' },
      { level: 1, label: '1★', class: 'badge-1' }
    ];

    function buildBoard(containerId, isInteractive = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      tierLevels.forEach(tl => {
        const row = document.createElement('div');
        row.className = 'tier-row';
        
        let zoneAttrs = `class="tier-zone" data-tier="${tl.level}"`;
        if (isInteractive) {
          zoneAttrs += ` onclick="handleZoneClick(event, this)"`;
        }

        row.innerHTML = `<div class="tier-badge ${tl.class}">${tl.label}</div><div ${zoneAttrs}></div>`;
        container.appendChild(row);
      });
    }

    // --- KATTINTÁSOS / POZICIONÁLÓ LOGIKA ---
    function handleImageClick(e, clickedId) {
      e.stopPropagation(); // Megakadályozza, hogy a mögötte lévő sáv is lefusson

      if (!selectedProductId) {
        // Nincs kiválasztva semmi -> ez lesz a kiválasztott
        selectedProductId = clickedId;
      } else if (selectedProductId === clickedId) {
        // Ugyanarra kattintott -> kijelölés törlése
        selectedProductId = null;
      } else {
        // Már volt kiválasztva egy, és rákattintott egy másikra -> beillesztés a másik elé
        moveProductBefore(selectedProductId, clickedId);
        selectedProductId = null;
        saveToFirebase();
      }
      renderMyView();
    }

    function handleZoneClick(e, zone) {
      if (!selectedProductId) return; // Ha nincs kijelölt termék, nem csinál semmit

      const targetTier = parseInt(zone.getAttribute('data-tier'), 10);
      const sourceIndex = myData.findIndex(i => i.id === selectedProductId);
      if (sourceIndex === -1) return;

      const sourceItem = myData[sourceIndex];
      sourceItem.t = targetTier;

      // Kivesszük és a sáv végére rakjuk
      myData.splice(sourceIndex, 1);
      
      if (targetTier === 0) {
        myData.push(sourceItem);
      } else {
        let lastIndex = -1;
        for (let i = 0; i < myData.length; i++) {
          if (myData[i].t === targetTier) lastIndex = i;
        }
        if (lastIndex !== -1) {
          myData.splice(lastIndex + 1, 0, sourceItem);
        } else {
          myData.push(sourceItem);
        }
      }

      updatePositions();
      selectedProductId = null;
      saveToFirebase();
      renderMyView();
    }

    function moveProductBefore(sourceId, targetId) {
      const sourceIndex = myData.findIndex(i => i.id === sourceId);
      const targetIndex = myData.findIndex(i => i.id === targetId);
      if (sourceIndex === -1 || targetIndex === -1) return;

      const sourceItem = myData[sourceIndex];
      const targetItem = myData[targetIndex];

      // Átállítjuk a tier-t a céltermékére
      sourceItem.t = targetItem.t;

      // Eltávolítjuk a forrást
      myData.splice(sourceIndex, 1);

      // Újra megkeressük a célt (mivel a törlés miatt eltolódhatott az index)
      const newTargetIndex = myData.findIndex(i => i.id === targetId);
      
      // Beszúrjuk elé
      myData.splice(newTargetIndex, 0, sourceItem);

      updatePositions();
    }

    function updatePositions() {
      for (let tier = 0; tier <= 5; tier++) {
        let pos = 1;
        myData.forEach(item => {
          if (item.t === tier) {
            item.p = tier === 0 ? 0 : pos++;
          }
        });
      }
    }

    function createImgElement(productId, isInteractive = false) {
      const prod = products.find(p => p.id === productId);
      const img = document.createElement('img');
      img.src = prod.img; 
      img.className = 'tier-img'; 
      img.setAttribute('data-id', productId);

      if (isInteractive) {
        if (productId === selectedProductId) {
          img.classList.add('selected');
        }
        img.onclick = (e) => handleImageClick(e, productId);
      }
      return img;
    }

    function connectToRoom() {
      const room = document.getElementById('room-input').value.trim();
      const userName = document.getElementById('name-input').value.trim();
      if (!room) return;

      localStorage.setItem('monster_room', room);
      if (userName) localStorage.setItem('monster_name', userName);

      if (currentConnectionRef) {
        currentConnectionRef.off();
      }

      currentConnectionRef = db.ref('rooms/' + room);
      currentConnectionRef.on('value', (snapshot) => {
        roomData = snapshot.val() || {};
        
        if (userName && roomData[userName]) {
          myData = roomData[userName];
          updatePositions();
          renderMyView();
        }

        updateFriendDropdown();
        renderGroupView();
      });
    }

    function leaveRoom() {
      if (currentConnectionRef) {
        currentConnectionRef.off();
        currentConnectionRef = null;
      }
      
      localStorage.removeItem('monster_room');
      localStorage.removeItem('monster_name');
      
      document.getElementById('room-input').value = '';
      document.getElementById('name-input').value = '';
      
      roomData = {};
      selectedProductId = null;
      resetMyDataToDefault();
      
      renderMyView();
      renderGroupView();
      updateFriendDropdown();
      
      switchTab('my', document.querySelector('.nav-tabs button:nth-child(2)'));
    }

    function saveToFirebase() {
      const room = document.getElementById('room-input').value.trim();
      const userName = document.getElementById('name-input').value.trim();
      if (!room || !userName) return;

      db.ref(`rooms/${room}/${userName}`).set(myData);
    }

    function updateFriendDropdown() {
      const select = document.getElementById('friend-select');
      const friendContainer = document.getElementById('friend-container');
      const noFriendsMsg = document.getElementById('no-friends-msg');
      
      const myName = document.getElementById('name-input').value.trim();
      const friendNames = Object.keys(roomData).filter(name => name !== myName);

      select.innerHTML = '';
      if (friendNames.length === 0) {
        friendContainer.style.display = 'none';
        noFriendsMsg.style.display = 'block';
      } else {
        friendContainer.style.display = 'block';
        noFriendsMsg.style.display = 'none';
        friendNames.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name; opt.innerText = name;
          select.appendChild(opt);
        });
        renderFriendView();
      }
    }

    function renderMyView() {
      buildBoard('my-board', true);
      const unassignedZone = document.querySelector('.unassigned-zone');
      unassignedZone.innerHTML = '';

      // Tiers szerinti rendezés p (pozíció) alapján
      const sortedData = [...myData].sort((a, b) => {
        if (a.t !== b.t) return a.t - b.t;
        return a.p - b.p;
      });

      sortedData.filter(item => item.t === 0).forEach(item => {
        const img = createImgElement(item.id, true);
        unassignedZone.appendChild(img);
      });

      tierLevels.forEach(tl => {
        const zone = document.querySelector(`#my-board .tier-zone[data-tier="${tl.level}"]`);
        sortedData.filter(item => item.t === tl.level).forEach(item => {
          const img = createImgElement(item.id, true);
          zone.appendChild(img);
        });
      });
    }

    function renderFriendView() {
      buildBoard('friend-board', false);
      const name = document.getElementById('friend-select').value;
      if (!name || !roomData[name]) return;

      const friendItems = [...roomData[name]].sort((a, b) => {
        if (a.t !== b.t) return a.t - b.t;
        return a.p - b.p;
      });

      friendItems.forEach(item => {
        if (item.t > 0) {
          const zone = document.querySelector(`#friend-board .tier-zone[data-tier="${item.t}"]`);
          if (zone) zone.appendChild(createImgElement(item.id, false));
        }
      });
    }

    function renderGroupView() {
      buildBoard('group-board', false);
      const allSubmissions = Object.values(roomData);
      if (allSubmissions.length === 0) return;

      const stats = {};
      products.forEach(p => stats[p.id] = { id: p.id, starSum: 0, posSum: 0, count: 0 });

      allSubmissions.forEach(sub => {
        sub.forEach(item => {
          if (item.t > 0) {
            stats[item.id].starSum += item.t;
            stats[item.id].posSum += item.p;
            stats[item.id].count += 1;
          }
        });
      });

      const processed = Object.values(stats).filter(s => s.count > 0).map(s => ({
        id: s.id, avgStars: s.starSum / s.count, posPoints: s.posSum
      }));

      const groupTiers = { 5:[], 4:[], 3:[], 2:[], 1:[] };
      processed.forEach(i => {
        if (i.avgStars >= 4.5) groupTiers[5].push(i);
        else if (i.avgStars >= 3.5) groupTiers[4].push(i);
        else if (i.avgStars >= 2.5) groupTiers[3].push(i);
        else if (i.avgStars >= 1.5) groupTiers[2].push(i);
        else groupTiers[1].push(i);
      });

      Object.keys(groupTiers).forEach(tLevel => {
        groupTiers[tLevel].sort((a,b) => (a.posPoints !== b.posPoints) ? a.posPoints - b.posPoints : b.avgStars - a.avgStars);
        const zone = document.querySelector(`#group-board .tier-zone[data-tier="${tLevel}"]`);
        groupTiers[tLevel].forEach(item => zone.appendChild(createImgElement(item.id, false)));
      });
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');

      const unassignedSection = document.querySelector('.unassigned-section');
      if (tabId === 'my') {
        unassignedSection.style.display = 'block';
      } else {
        unassignedSection.style.display = 'none';
      }

      if (tabId === 'group') renderGroupView();
      if (tabId === 'my') renderMyView();
      if (tabId === 'friends') renderFriendView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedRoom = localStorage.getItem('monster_room');
      const savedName = localStorage.getItem('monster_name');
      if (savedRoom) document.getElementById('room-input').value = savedRoom;
      if (savedName) document.getElementById('name-input').value = savedName;
      
      renderMyView();
      renderGroupView();

      if (savedRoom) {
        connectToRoom();
      }
    });
  </script>
</body>
</html>
