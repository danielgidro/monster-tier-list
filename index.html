<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monster Group TierApp</title>
  <style>
    :root {
      --tier-5: #ff3b30; --tier-4: #ff9500; --tier-3: #ffcc00; --tier-2: #11a84e; --tier-1: #007aff; 
      --bg-dark: #121212; --surface: #1c1c1e; --accent: #30d158; --danger: #ff453a;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: #fff; margin: 0; padding: 15px; padding-bottom: 150px; }
    h1 { margin-bottom: 2px; font-size: 22px; text-transform: uppercase; text-align: center; }
    p.subtitle { color: #8e8e93; margin-bottom: 15px; font-size: 13px; text-align: center; }
    .room-bar { background: var(--surface); padding: 12px; border-radius: 10px; width: 100%; max-width: 800px; margin: 0 auto 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid #3a3a3c; box-sizing: border-box; }
    .room-bar input { background: #2c2c2e; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; width: 90px; }
    .room-bar button { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .leave-btn { background: var(--danger) !important; color: #fff !important; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; }
    .tab-btn { background: #2c2c2e; color: #8e8e93; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .tab-btn.active { background: var(--accent); color: #000; }
    .tab-content { display: none; width: 100%; max-width: 800px; margin: 0 auto; }
    .tab-content.active { display: block; }
    .tier-board { display: flex; flex-direction: column; gap: 6px; background: #000; padding: 6px; border-radius: 10px; }
    .tier-row { display: flex; background: var(--surface); min-height: 90px; border-radius: 6px; overflow: hidden; align-items: center; }
    .tier-badge { width: 60px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #000; height: 100%; flex-shrink: 0; }
    .badge-5 { background: var(--tier-5); } .badge-4 { background: var(--tier-4); } .badge-3 { background: var(--tier-3); } .badge-2 { background: var(--tier-2); } .badge-1 { background: var(--tier-1); }
    .tier-zone { flex: 1; display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 8px; overflow-x: auto; overflow-y: hidden; min-height: 75px; -webkit-overflow-scrolling: touch; }
    .tier-zone.drag-hover { background: rgba(255, 255, 255, 0.1); }
    .unassigned-section { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28, 28, 30, 0.95); padding: 10px; border-top: 1px solid #3a3a3c; z-index: 100; }
    .tier-img { height: 70px; width: 70px; object-fit: contain; cursor: grab; flex-shrink: 0; border-radius: 6px; user-select: none; }
    .tier-img.dragging { opacity: 0.3; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.0/DragDropTouch.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>Monster Group TierList</h1>
  <div class="room-bar">
    <input type="text" id="room-input" placeholder="Room">
    <input type="text" id="name-input" placeholder="Name">
    <div>
      <button onclick="connectToRoom()">Join</button>
      <button class="leave-btn" onclick="leaveRoom()">Leave</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('group', this)">Group</button>
    <button class="tab-btn" onclick="switchTab('my', this)">My Tier</button>
  </div>

  <div id="tab-group" class="tab-content active"><div id="group-board" class="tier-board"></div></div>
  <div id="tab-my" class="tab-content"><div id="my-board" class="tier-board"></div></div>

  <div class="unassigned-section" id="unassigned-area">
    <div class="tier-zone" id="unassigned-zone" data-tier="0"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBm-OZUTOdc20Jx637WFLXCrQs_QnHViYA",
      authDomain: "monster-tier-list.firebaseapp.com",
      projectId: "monster-tier-list",
      storageBucket: "monster-tier-list.firebasestorage.app",
      messagingSenderId: "155876294578",
      appId: "1:155876294578:web:3641c1bc9513b4bf16eeab",
      databaseURL: "https://monster-tier-list-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const products = Array.from({length:31}, (_,i) => ({id: String(i+1), img: `${i+1}.png`}));
    let myData = products.map(p => ({id: p.id, t: 0, p: 0}));
    let roomData = {};
    let dbRef = null;

    function buildBoard(id, interactive) {
      const container = document.getElementById(id);
      container.innerHTML = '';
      [5,4,3,2,1].forEach(lvl => {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.innerHTML = `<div class="tier-badge badge-${lvl}">${lvl}★</div><div class="tier-zone" data-tier="${lvl}"></div>`;
        container.appendChild(row);
      });
      if (interactive) attachEvents();
    }

    function attachEvents() {
      document.querySelectorAll('.tier-zone').forEach(zone => {
        zone.addEventListener('dragover', e => {
          e.preventDefault();
          const dragging = document.querySelector('.dragging');
          const after = getAfterElement(zone, e.clientX);
          after ? zone.insertBefore(dragging, after) : zone.appendChild(dragging);
        });
        zone.addEventListener('drop', e => {
          updateData();
          save();
          render();
        });
      });
    }

    function getAfterElement(zone, x) {
      const els = [...zone.querySelectorAll('.tier-img:not(.dragging)')];
      return els.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = x - box.left - box.width / 2;
        return (offset < 0 && offset > closest.offset) ? {offset, element: child} : closest;
      }, {offset: Number.NEGATIVE_INFINITY}).element;
    }

    function updateData() {
      const updated = [];
      document.querySelectorAll('.tier-zone').forEach(zone => {
        const t = parseInt(zone.getAttribute('data-tier'));
        zone.querySelectorAll('.tier-img').forEach((img, i) => {
          updated.push({id: img.dataset.id, t: t, p: i});
        });
      });
      myData = updated;
    }

    function render() {
      document.querySelectorAll('.tier-zone').forEach(z => z.innerHTML = '');
      myData.forEach(item => {
        const img = document.createElement('img');
        img.src = item.id + '.png';
        img.className = 'tier-img';
        img.dataset.id = item.id;
        img.draggable = true;
        img.ondragstart = () => img.classList.add('dragging');
        img.ondragend = () => img.classList.remove('dragging');
        const zone = document.querySelector(`.tier-zone[data-tier="${item.t}"]`);
        if (zone) zone.appendChild(img);
      });
    }

    function connectToRoom() {
      const room = document.getElementById('room-input').value.trim();
      const name = document.getElementById('name-input').value.trim();
      if (!room || !name) return;
      if (dbRef) dbRef.off();
      dbRef = db.ref('rooms/' + room);
      dbRef.on('value', s => { roomData = s.val() || {}; if(roomData[name]) myData = roomData[name]; render(); });
    }

    function leaveRoom() {
      if (dbRef) dbRef.off();
      myData = products.map(p => ({id: p.id, t: 0, p: 0}));
      render();
    }

    function save() {
      const room = document.getElementById('room-input').value.trim();
      const name = document.getElementById('name-input').value.trim();
      if (room && name) db.ref(`rooms/${room}/${name}`).set(myData);
    }

    function switchTab(id, btn) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      btn.classList.add('active');
      document.getElementById('unassigned-area').style.display = id === 'my' ? 'block' : 'none';
    }

    buildBoard('my-board', true);
    buildBoard('group-board', false);
    render();
  </script>
</body>
</html>
