<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Energy Tier List</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #85c441;
      --text-color: #ffffff;
      --text-muted: #a0a0b0;
      --border-color: #2a2a3a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: var(--accent-color);
      font-size: 2.5rem;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(133, 196, 65, 0.3);
    }

    .user-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input, select {
      background: #0f0f15;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 10px 20px;
      font-size: 1rem;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent-color);
      border-color: var(--border-color);
      border-bottom-color: var(--accent-color);
    }

    .view-content {
      display: none;
    }

    .view-content.active {
      display: block;
    }

    .tier-row {
      display: flex;
      min-height: 110px;
      background: var(--card-bg);
      margin-bottom: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .tier-label {
      width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #000;
      flex-shrink: 0;
    }

    .tier-5 { background-color: #ff7f7f; }
    .tier-4 { background-color: #ffbf7f; }
    .tier-3 { background-color: #ffdf7f; }
    .tier-2 { background-color: #ffff7f; }
    .tier-1 { background-color: #bfff7f; }
    .tier-unassigned { background-color: #2a2a3a; color: #fff; }

    .tier-dropzone {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      flex-grow: 1;
      min-height: 110px;
      align-items: center;
    }

    .monster-card {
      width: 70px;
      height: 90px;
      background: #0f0f15;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px;
      cursor: grab;
      user-select: none;
      border: 1px solid var(--border-color);
      transition: transform 0.15s, border-color 0.15s;
    }

    .monster-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .monster-card img {
      max-width: 100%;
      max-height: 60px;
      object-fit: contain;
      pointer-events: none;
    }

    .monster-card .name {
      font-size: 0.65rem;
      text-align: center;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: var(--text-muted);
    }

    .friend-selector-container {
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Monster Energy Tier List</h1>
    </header>

    <div class="user-controls">
      <div class="input-group">
        <label for="room-input">Room:</label>
        <input type="text" id="room-input" value="monster2026">
      </div>
      <div class="input-group">
        <label for="username-input">Name:</label>
        <input type="text" id="username-input" placeholder="Enter your name">
      </div>
      <button onclick="connectToRoom()">Join Room</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('my-tier')">✏️ My Tier</button>
      <button class="tab-btn" onclick="switchTab('group-tier')">📊 Group Tier</button>
      <button class="tab-btn" onclick="switchTab('friends-tier')">👥 Friends</button>
    </div>

    <div id="my-tier" class="view-content active">
      <div class="tier-row"><div class="tier-label tier-5">5★</div><div class="tier-dropzone" data-stars="5"></div></div>
      <div class="tier-row"><div class="tier-label tier-4">4★</div><div class="tier-dropzone" data-stars="4"></div></div>
      <div class="tier-row"><div class="tier-label tier-3">3★</div><div class="tier-dropzone" data-stars="3"></div></div>
      <div class="tier-row"><div class="tier-label tier-2">2★</div><div class="tier-dropzone" data-stars="2"></div></div>
      <div class="tier-row"><div class="tier-label tier-1">1★</div><div class="tier-dropzone" data-stars="1"></div></div>
      
      <h3 style="margin: 20px 0 10px 0; color: var(--text-muted);">Unassigned</h3>
      <div class="tier-row"><div class="tier-label tier-unassigned">Pool</div><div class="tier-dropzone" id="unassigned-zone" data-stars="0"></div></div>
    </div>

    <div id="group-tier" class="view-content">
      <div id="group-rows-container"></div>
    </div>

    <div id="friends-tier" class="view-content">
      <div class="friend-selector-container">
        <label for="friend-select">Select Friend: </label>
        <select id="friend-select" onchange="renderFriendView()">
          <option value="">-- Choose a friend --</option>
        </select>
      </div>
      <div id="friend-rows-container"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://monster-tier-list-default-rtdb.firebaseio.com"
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const products = [
      { id: '1',  name: 'Aussie Lemonade',          img: 'Aussie Lemonade.png' },
      { id: '2',  name: 'Bad Apple',                img: 'Bad Apple.png' },
      { id: '3',  name: 'Energy Zero Sugar',        img: 'Energy Zero Sugar.png' },
      { id: '4',  name: 'Energy',                   img: 'Energy.png' },
      { id: '5',  name: 'Full Throttle',            img: 'Full Throttle.png' },
      { id: '6',  name: 'Khaotic',                  img: 'Khaotic.png' },
      { id: '7',  name: 'Lando Norris',             img: 'Lando Norris.png' },
      { id: '8',  name: 'Mango Loco',               img: 'Mango Loco.png' },
      { id: '9',  name: 'Monarch',                  img: 'Monarch.png' },
      { id: '10', name: 'Nitro Cosmic Peach',       img: 'Nitro Cosmic Peach.png' },
      { id: '11', name: 'Nitro Super Dry',          img: 'Nitro Super Dry.png' },
      { id: '12', name: 'Pacific Punch',            img: 'Pacific Punch.png' },
      { id: '13', name: 'Pipeline Punch',           img: 'Pipeline Punch.png' },
      { id: '14', name: 'Rehab Lemonade Tea',       img: 'Rehab Lemonade Tea.png' },
      { id: '15', name: 'Rehab Peach Tea',          img: 'Rehab Peach Tea.png' },
      { id: '16', name: 'Rio Punch',                img: 'Rio Punch.png' },
      { id: '17', name: 'Ultra Black',              img: 'Ultra Black.png' },
      { id: '18', name: 'Ultra Fantasy Ruby Red',   img: 'Ultra Fantasy Ruby Red.png' },
      { id: '19', name: 'Ultra Fiesta Mango',       img: 'Ultra Fiesta Mango.png' },
      { id: '20', name: 'Ultra Golden Pineapple',   img: 'Ultra Golden Pineapple.png' },
      { id: '21', name: 'Ultra Paradise',           img: 'Ultra Paradise.png' },
      { id: '22', name: 'Ultra Peachy Keen',        img: 'Ultra Peachy Keen.png' },
      { id: '23', name: 'Ultra Rosa',               img: 'Ultra Rosa.png' },
      { id: '24', name: 'Ultra Strawberry Dreams',  img: 'Ultra Strawberry Dreams.png' },
      { id: '25', name: 'Ultra Vice Guava',         img: 'Ultra Vice Guava.png' },
      { id: '26', name: 'Ultra Violet',             img: 'Ultra Violet.png' },
      { id: '27', name: 'Ultra Watermelon',         img: 'Ultra Watermelon.png' },
      { id: '28', name: 'Ultra Zero',               img: 'Ultra Zero.png' },
      { id: '29', name: 'Viking Berry',             img: 'Viking Berry.png' },
      { id: '30', name: 'VR46 Doctor',              img: 'VR46 Doctor.png' },
      { id: '31', name: 'VR46 Zero',                img: 'VR46 Zero.png' }
    ];

    let userRatings = {};
    let roomData = {};

    window.onload = () => {
      initMyTierView();
      setupDragAndDrop();
    };

    function initMyTierView() {
      const unassignedZone = document.getElementById('unassigned-zone');
      unassignedZone.innerHTML = '';
      
      products.forEach(prod => {
        userRatings[prod.id] = 0;
        const card = createCardElement(prod);
        unassignedZone.appendChild(card);
      });
    }

    function createCardElement(product) {
      const card = document.createElement('div');
      card.className = 'monster-card';
      card.draggable = true;
      card.id = 'card-' + product.id;
      card.dataset.id = product.id;

      card.innerHTML = `
        <img src="${product.img}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/60x80?text=Monster'">
        <div class="name">${product.name}</div>
      `;

      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', product.id);
      });

      return card;
    }

    function setupDragAndDrop() {
      const dropzones = document.querySelectorAll('.tier-dropzone');
      
      dropzones.forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
        });

        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          const prodId = e.dataTransfer.getData('text/plain');
          const card = document.getElementById('card-' + prodId);
          if (!card) return;

          const stars = parseInt(zone.dataset.stars);
          userRatings[prodId] = stars;

          if (stars === 0) {
            zone.appendChild(card);
            sortUnassignedZone(zone);
          } else {
            zone.appendChild(card);
          }

          saveToFirebase();
        });
      });
    }

    function sortUnassignedZone(zone) {
      const cards = Array.from(zone.children);
      cards.sort((a, b) => parseInt(a.dataset.id) - parseInt(b.dataset.id));
      cards.forEach(card => zone.appendChild(card));
    }

    function connectToRoom() {
      const room = document.getElementById('room-input').value.trim();
      if (!room) return;

      db.ref('rooms/' + room).on('value', (snapshot) => {
        roomData = snapshot.val() || {};
        updateFriendDropdown();
        renderGroupView();
        renderFriendView();
      });

      saveToFirebase();
    }

    function saveToFirebase() {
      const room = document.getElementById('room-input').value.trim();
      const userName = document.getElementById('username-input').value.trim();

      if (room && userName) {
        db.ref('rooms/' + room + '/' + userName).set(userRatings);
      }
    }

    function updateFriendDropdown() {
      const select = document.getElementById('friend-select');
      if (!select) return;

      const currentVal = select.value;
      const myName = document.getElementById('username-input').value.trim();

      select.innerHTML = '<option value="">-- Choose a friend --</option>';

      Object.keys(roomData).forEach(userName => {
        if (userName !== myName) {
          const option = document.createElement('option');
          option.value = userName;
          option.textContent = userName;
          select.appendChild(option);
        }
      });

      select.value = currentVal;
    }

    function renderGroupView() {
      const container = document.getElementById('group-rows-container');
      container.innerHTML = '';

      const users = Object.keys(roomData);
      if (users.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No data in this room yet.</p>';
        return;
      }

      const averages = {};
      products.forEach(p => {
        let sum = 0;
        let count = 0;
        users.forEach(u => {
          const val = roomData[u][p.id];
          if (val && val > 0) {
            sum += val;
            count++;
          }
        });
        averages[p.id] = count > 0 ? (sum / count) : 0;
      });

      const grouped = { 5: [], 4: [], 3: [], 2: [], 1: [], 0: [] };
      products.forEach(p => {
        const avg = averages[p.id];
        const rounded = Math.round(avg);
        if (grouped[rounded] !== undefined) {
          grouped[rounded].push(p);
        } else {
          grouped[0].push(p);
        }
      });

      [5, 4, 3, 2, 1, 0].forEach(stars => {
        const labelText = stars === 0 ? 'Pool' : stars + '★';
        const labelClass = stars === 0 ? 'tier-unassigned' : 'tier-' + stars;
        
        const row = document.createElement('div');
        row.className = 'tier-row';
        
        let cardsHtml = '';
        grouped[stars].forEach(p => {
          cardsHtml += `
            <div class="monster-card">
              <img src="${p.img}" alt="${p.name}">
              <div class="name">${p.name}</div>
            </div>
          `;
        });

        row.innerHTML = `
          <div class="tier-label ${labelClass}">${labelText}</div>
          <div class="tier-dropzone">${cardsHtml}</div>
        `;
        container.appendChild(row);
      });
    }

    function renderFriendView() {
      const container = document.getElementById('friend-rows-container');
      const friendName = document.getElementById('friend-select').value;
      container.innerHTML = '';

      if (!friendName || !roomData[friendName]) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Select a friend to view their tier list.</p>';
        return;
      }

      const friendRatings = roomData[friendName];
      const grouped = { 5: [], 4: [], 3: [], 2: [], 1: [], 0: [] };

      products.forEach(p => {
        const rating = friendRatings[p.id] || 0;
        grouped[rating].push(p);
      });

      [5, 4, 3, 2, 1, 0].forEach(stars => {
        const labelText = stars === 0 ? 'Pool' : stars + '★';
        const labelClass = stars === 0 ? 'tier-unassigned' : 'tier-' + stars;
        
        const row = document.createElement('div');
        row.className = 'tier-row';
        
        let cardsHtml = '';
        grouped[stars].forEach(p => {
          cardsHtml += `
            <div class="monster-card">
              <img src="${p.img}" alt="${p.name}">
              <div class="name">${p.name}</div>
            </div>
          `;
        });

        row.innerHTML = `
          <div class="tier-label ${labelClass}">${labelText}</div>
          <div class="tier-dropzone">${cardsHtml}</div>
        `;
        container.appendChild(row);
      });
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if (tabId === 'group-tier') renderGroupView();
      if (tabId === 'friends-tier') renderFriendView();
    }
  </script>
</body>
</html>
