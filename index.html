<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monster Group TierApp</title>
  <style>
    :root {
      --tier-5: #ff3b30; --tier-4: #ff9500; --tier-3: #ffcc00; --tier-2: #11a84e; --tier-1: #007aff;
      --bg-dark: #121212; --surface: #1c1c1e; --accent: #30d158;
    }
    body { font-family: -apple-system, sans-serif; background-color: var(--bg-dark); color: #fff; margin: 0; padding: 10px; }
    
    .room-bar { background: var(--surface); padding: 10px; border-radius: 8px; display: flex; gap: 5px; margin-bottom: 10px; }
    .room-bar input { flex: 1; padding: 8px; border-radius: 4px; border: none; background: #333; color: #fff; }
    .room-bar button { padding: 8px; background: var(--accent); border: none; border-radius: 4px; font-weight: bold; }

    .tier-board { display: flex; flex-direction: column; gap: 6px; background: #000; padding: 6px; border-radius: 8px; margin-bottom: 120px; }
    .tier-row { display: flex; background: var(--surface); border-radius: 6px; min-height: 60px; overflow: hidden; }
    
    .tier-badge { width: 50px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #000; flex-shrink: 0; }
    .badge-5 { background: var(--tier-5); }
    .badge-4 { background: var(--tier-4); }
    .badge-3 { background: var(--tier-3); }
    .badge-2 { background: var(--tier-2); }
    .badge-1 { background: var(--tier-1); }

    /* A Zóna: Egymás alatt elrendezés */
    .tier-zone { flex: 1; display: flex; flex-wrap: wrap; padding: 5px; gap: 5px; min-height: 55px; }
    .tier-zone.drag-hover { background: rgba(255, 255, 255, 0.1); }

    .tier-img { height: 50px; width: 50px; object-fit: contain; cursor: grab; user-select: none; border-radius: 4px; -webkit-touch-callout: none; }
    .tier-img.dragging { opacity: 0.3; }

    /* Alsó csúszka */
    .unassigned-section { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e; padding: 10px; border-top: 1px solid #333; z-index: 1000; }
    .unassigned-zone { display: flex; flex-direction: row; overflow-x: auto; gap: 10px; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
    .unassigned-zone .tier-img { flex-shrink: 0; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.0/DragDropTouch.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="room-bar">
    <input type="text" id="room-input" placeholder="Room">
    <input type="text" id="name-input" placeholder="Name">
    <button onclick="connectToRoom()">Join</button>
  </div>

  <div id="board" class="tier-board"></div>

  <div class="unassigned-section">
    <div class="tier-zone unassigned-zone" data-tier="0" id="unassigned-zone"></div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://monster-tier-list-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const products = Array.from({length: 31}, (_, i) => ({ id: (i+1).toString(), img: `${i+1}.png` })); // Képek: 1.png, 2.png...
    let myData = products.map(p => ({ id: p.id, t: 0 }));

    function init() {
      const board = document.getElementById('board');
      [5,4,3,2,1].forEach(level => {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.innerHTML = `<div class="tier-badge badge-${level}">${level}★</div><div class="tier-zone" data-tier="${level}"></div>`;
        board.appendChild(row);
      });
      attachDragEvents();
      render();
    }

    function attachDragEvents() {
      document.querySelectorAll('.tier-zone').forEach(zone => {
        zone.addEventListener('dragover', e => {
          e.preventDefault();
          zone.classList.add('drag-hover');
        });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-hover'));
        zone.addEventListener('drop', e => {
          e.preventDefault();
          zone.classList.remove('drag-hover');
          const id = draggedImg.getAttribute('data-id');
          const tier = parseInt(zone.getAttribute('data-tier'));
          myData.find(x => x.id === id).t = tier;
          saveToFirebase();
          render();
        });
      });
    }

    let draggedImg = null;
    function render() {
      document.querySelectorAll('.tier-zone').forEach(z => z.innerHTML = '');
      myData.forEach(item => {
        const img = document.createElement('img');
        img.src = item.id + '.png'; 
        img.className = 'tier-img';
        img.setAttribute('data-id', item.id);
        img.draggable = true;
        img.addEventListener('dragstart', () => { draggedImg = img; img.classList.add('dragging'); });
        img.addEventListener('dragend', () => { img.classList.remove('dragging'); });
        
        const zone = document.querySelector(`.tier-zone[data-tier="${item.t}"]`);
        zone.appendChild(img);
      });
    }

    function saveToFirebase() {
      const room = document.getElementById('room-input').value.trim();
      const name = document.getElementById('name-input').value.trim();
      if (room && name) db.ref(`rooms/${room}/${name}`).set(myData);
    }

    function connectToRoom() {
      const room = document.getElementById('room-input').value.trim();
      db.ref('rooms/' + room).on('value', (s) => {
        const name = document.getElementById('name-input').value.trim();
        if (name && s.val() && s.val()[name]) {
          myData = s.val()[name];
          render();
        }
      });
    }

    init();
  </script>
</body>
</html>
